<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mine Sange</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0a1a;
      min-height: 100vh;
      color: #e2e8f0;
      padding: 32px 20px 100px;
    }

    .container { max-width: 700px; margin: 0 auto; }

    .header { text-align: center; margin-bottom: 32px; }
    .header .big-emoji { font-size: 3.5rem; }
    .header h1 { font-size: 2rem; color: #c084fc; margin: 8px 0 6px; }
    .header p  { color: #7c6a9e; font-size: 0.95rem; }

    .stats { display: flex; gap: 10px; margin-bottom: 24px; }
    .stat {
      flex: 1; background: #1a1030; border: 1px solid #2d1f4a;
      border-radius: 14px; padding: 14px 10px; text-align: center;
    }
    .stat .num { font-size: 1.6rem; font-weight: 700; }
    .stat .lbl { font-size: 0.72rem; color: #7c6a9e; margin-top: 3px; }
    .stat.want .num     { color: #60a5fa; }
    .stat.learning .num { color: #f59e0b; }
    .stat.mastered .num { color: #4ade80; }

    .toolbar {
      display: flex; gap: 8px; margin-bottom: 16px;
      flex-wrap: wrap; align-items: center;
    }
    .filter-btn {
      background: #1a1030; border: 1px solid #2d1f4a; border-radius: 20px;
      padding: 7px 16px; font-size: 0.82rem; color: #7c6a9e;
      cursor: pointer; transition: all 0.2s; font-family: inherit; white-space: nowrap;
    }
    .filter-btn:hover  { border-color: #7c3aed; color: #c084fc; }
    .filter-btn.active { background: #7c3aed; border-color: #7c3aed; color: #fff; }
    .search-input {
      flex: 1; min-width: 140px; background: #1a1030; border: 1px solid #2d1f4a;
      border-radius: 20px; padding: 7px 16px; font-size: 0.85rem;
      color: #e2e8f0; outline: none; font-family: inherit; transition: border-color 0.2s;
    }
    .search-input:focus { border-color: #7c3aed; }
    .search-input::placeholder { color: #4a3a6a; }

    /* ── Song card ── */
    .songs-list { display: flex; flex-direction: column; gap: 14px; }
    .song-card {
      background: #1a1030; border: 1px solid #2d1f4a;
      border-radius: 18px; overflow: hidden; transition: border-color 0.2s;
      cursor: pointer;
    }
    .song-card:hover { border-color: #5b21b6; }
    .song-top {
      display: flex; align-items: flex-start;
      gap: 14px; padding: 16px 18px 12px;
    }
    .song-link {
      display: flex; align-items: flex-start; gap: 14px;
      flex: 1; min-width: 0; cursor: pointer;
    }

    /* ── Detail modal ── */
    .detail-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.85); z-index: 300;
      align-items: center; justify-content: center; padding: 16px;
    }
    .detail-overlay.open { display: flex; }
    .detail-modal {
      background: #1a1030; border: 1px solid #3d2b60;
      border-radius: 22px; width: 100%; max-width: 900px;
      max-height: 90vh; display: flex; flex-direction: column;
      overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,0.7);
    }
    .dm-header {
      display: flex; align-items: flex-start; gap: 14px;
      padding: 20px 24px; border-bottom: 1px solid #2d1f4a; flex-shrink: 0;
    }
    .dm-info { flex: 1; min-width: 0; }
    .dm-title  { font-size: 1.2rem; font-weight: 700; color: #e2e8f0; }
    .dm-artist { font-size: 0.85rem; color: #7c6a9e; margin-top: 3px; }
    .dm-badges { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .dm-close {
      background: #2d1f4a; border: none; border-radius: 8px;
      padding: 6px 11px; color: #7c6a9e; cursor: pointer;
      font-size: 1rem; transition: all 0.15s; flex-shrink: 0;
    }
    .dm-close:hover { background: #3d2b60; color: #f87171; }
    .dm-body {
      display: flex; flex: 1; min-height: 0; overflow: hidden;
    }
    .dm-lyrics-pane {
      flex: 1; overflow-y: auto; padding: 20px 24px;
      border-right: 1px solid #2d1f4a; display: flex; flex-direction: column; gap: 18px;
    }
    .dm-notes-pane {
      width: 310px; flex-shrink: 0; padding: 20px 24px;
      display: flex; flex-direction: column;
    }
    .dm-pane-label {
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: #5b4a7a; margin-bottom: 10px;
    }
    .dm-tabs { display: flex; gap: 8px; margin-bottom: 2px; }
    .dm-tab {
      background: #1a1030; border: 1px solid #2d1f4a; border-radius: 20px;
      padding: 5px 14px; font-size: 0.8rem; color: #7c6a9e;
      cursor: pointer; font-family: inherit; transition: all 0.2s;
    }
    .dm-tab:hover  { border-color: #7c3aed; color: #c084fc; }
    .dm-tab.active { background: #7c3aed; border-color: #7c3aed; color: #fff; }
    #dm-lyrics-text {
      font-size: 0.93rem; line-height: 2; white-space: pre-wrap;
      word-break: break-word; color: #c4b5d4;
    }
    #dm-lyrics-text.translit { color: #a5b4fc; }
    .dm-no-lyrics { color: #4a3a6a; font-style: italic; font-size: 0.9rem; }
    #dm-notes {
      flex: 1; width: 100%; background: #0f0a1a;
      border: 1px solid #2d1f4a; border-radius: 14px;
      padding: 14px; font-size: 0.9rem; color: #e2e8f0;
      font-family: 'Segoe UI', sans-serif; resize: none;
      outline: none; line-height: 1.8; transition: border-color 0.2s; min-height: 180px;
    }
    #dm-notes:focus { border-color: #7c3aed; }
    #dm-notes::placeholder { color: #4a3a6a; }
    .dm-save-status { font-size: 0.78rem; color: #4ade80; margin-top: 8px; text-align: right; min-height: 18px; }
    .dm-save-status.error { color: #f87171; }
    @media (max-width: 620px) {
      .dm-body { flex-direction: column; }
      .dm-lyrics-pane { border-right: none; border-bottom: 1px solid #2d1f4a; max-height: 50vh; }
      .dm-notes-pane { width: 100%; }
    }
    .song-icon {
      font-size: 1.8rem; width: 46px; height: 46px;
      background: #2d1f4a; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .song-main { flex: 1; min-width: 0; }
    .song-title  { font-size: 1.05rem; font-weight: 700; color: #e2e8f0; }
    .song-artist { font-size: 0.85rem; color: #7c6a9e; margin-top: 2px; }
    .song-badges { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
    .badge { font-size: 0.73rem; padding: 3px 10px; border-radius: 20px; font-weight: 600; white-space: nowrap; }
    .badge.want     { background: #1e3a5f; color: #60a5fa; }
    .badge.learning { background: #3d2a05; color: #f59e0b; }
    .badge.mastered { background: #052e16; color: #4ade80; }
    .badge.key      { background: #2d1f4a; color: #c084fc; }
    .song-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .action-btn {
      background: none; border: none; font-size: 1rem; cursor: pointer;
      padding: 6px 8px; border-radius: 8px; color: #4a3a6a; transition: all 0.15s;
    }
    .action-btn:hover     { background: #2d1f4a; color: #c084fc; }
    .action-btn.del:hover { color: #f87171; }

    /* Section tips */
    .song-sections { padding: 0 18px 10px; display: flex; flex-direction: column; gap: 6px; }
    .section-tip   { display: flex; gap: 8px; align-items: flex-start; font-size: 0.83rem; }
    .section-label { font-weight: 700; white-space: nowrap; flex-shrink: 0; padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; }
    .sl-verse   { background: #1e3055; color: #93c5fd; }
    .sl-chorus  { background: #3b0764; color: #d8b4fe; }
    .sl-bridge  { background: #431407; color: #fb923c; }
    .sl-high    { background: #3d0505; color: #f87171; }
    .sl-breath  { background: #052e16; color: #6ee7b7; }
    .sl-key     { background: #1c1c3d; color: #a5b4fc; }
    .sl-general { background: #1f2937; color: #94a3b8; }
    .section-text { color: #c4b5d4; line-height: 1.45; }

    /* Lyrics toggle */
    .lyrics-toggle { padding: 6px 18px 12px; }
    .toggle-btn {
      background: none; border: 1px solid #2d1f4a; border-radius: 20px;
      color: #7c6a9e; font-size: 0.78rem; cursor: pointer;
      padding: 4px 12px; font-family: inherit; transition: all 0.2s;
    }
    .toggle-btn:hover { border-color: #7c3aed; color: #c084fc; }
    .lyrics-panel { display: none; padding: 0 18px 18px; }
    .lyrics-panel.open { display: block; }
    .lyrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .lyrics-grid.single { grid-template-columns: 1fr; }
    .lyrics-col label {
      display: block; font-size: 0.72rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.06em; color: #5b4a7a; margin-bottom: 6px;
    }
    .lyrics-col pre {
      font-family: 'Segoe UI', sans-serif; font-size: 0.88rem; line-height: 1.7;
      white-space: pre-wrap; word-break: break-word;
      background: #0f0a1a; border: 1px solid #2d1f4a;
      border-radius: 10px; padding: 12px 14px; color: #c4b5d4;
    }
    .lyrics-col.translit pre { color: #a5b4fc; }
    @media (max-width: 520px) { .lyrics-grid { grid-template-columns: 1fr; } }

    /* Empty state */
    .empty-state { text-align: center; padding: 52px 20px; color: #4a3a6a; }
    .empty-state .e-icon { font-size: 3.5rem; margin-bottom: 14px; }
    .empty-state p { font-size: 0.95rem; line-height: 1.6; }

    /* ── Modal ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.78); z-index: 200;
      align-items: flex-start; justify-content: center;
      padding: 20px; overflow-y: auto;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #1a1030; border: 1px solid #3d2b60;
      border-radius: 22px; padding: 28px;
      width: 100%; max-width: 520px; margin: auto;
      box-shadow: 0 24px 60px rgba(0,0,0,0.6);
    }
    .modal h2 { font-size: 1.2rem; color: #c084fc; margin-bottom: 22px; }

    .form-row { display: flex; gap: 12px; }
    .form-row .form-group { flex: 1; }
    .form-group { margin-bottom: 14px; }
    .form-group > label {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.8rem; color: #7c6a9e; margin-bottom: 5px;
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .fetch-status { font-weight: 400; font-size: 0.78rem; text-transform: none; letter-spacing: 0; }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%; background: #0f0a1a; border: 1px solid #2d1f4a;
      border-radius: 10px; padding: 10px 13px; font-size: 0.93rem;
      color: #e2e8f0; outline: none; font-family: inherit; transition: border-color 0.2s;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus { border-color: #7c3aed; }
    .form-group select option { background: #1a1030; }
    .form-group textarea { resize: vertical; min-height: 110px; line-height: 1.6; }

    /* Suggestions dropdown */
    .input-wrap { position: relative; }
    .suggestions-box {
      display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: #1e1535; border: 1px solid #3d2b60; border-radius: 14px;
      z-index: 400; overflow: hidden; box-shadow: 0 12px 32px rgba(0,0,0,0.5);
    }
    .suggestions-box.open { display: block; }
    .sug-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; cursor: pointer; transition: background 0.15s;
      border-bottom: 1px solid #2d1f4a;
    }
    .sug-item:last-child { border-bottom: none; }
    .sug-item:hover { background: #2d1f4a; }
    .sug-thumb { width: 38px; height: 38px; border-radius: 8px; object-fit: cover; flex-shrink: 0; background: #2d1f4a; }
    .sug-info { flex: 1; min-width: 0; }
    .sug-title  { font-size: 0.88rem; font-weight: 600; color: #e2e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sug-artist { font-size: 0.76rem; color: #7c6a9e; margin-top: 1px; }
    .sug-no-results { padding: 12px 14px; font-size: 0.85rem; color: #5b4a7a; text-align: center; }

    /* Transliteration row */
    .translit-label-row {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px;
    }
    .translit-label-row > label { margin-bottom: 0; }
    .auto-btn {
      background: #2d1f4a; border: none; border-radius: 8px; padding: 5px 12px;
      color: #c084fc; font-size: 0.78rem; font-weight: 700; cursor: pointer;
      font-family: inherit; transition: background 0.15s; display: flex; align-items: center; gap: 5px;
    }
    .auto-btn:hover    { background: #3d2b60; }
    .auto-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .spinner {
      width: 12px; height: 12px; border: 2px solid #7c3aed;
      border-top-color: transparent; border-radius: 50%;
      animation: spin 0.7s linear infinite; display: none;
    }
    .auto-btn.loading .spinner  { display: block; }
    .auto-btn.loading .btn-lbl  { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Tips builder */
    .tips-header { display: flex; align-items: center; margin-bottom: 10px; }
    .tips-header label { font-size: 0.8rem; color: #7c6a9e; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    .tips-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
    .tip-row {
      display: flex; gap: 8px; align-items: center;
      background: #0f0a1a; border: 1px solid #2d1f4a;
      border-radius: 10px; padding: 8px 10px; font-size: 0.83rem;
    }
    .tip-row .tip-slbl { font-weight: 700; white-space: nowrap; flex-shrink: 0; }
    .tip-row .tip-txt  { flex: 1; color: #c4b5d4; }
    .tip-del { background: none; border: none; color: #4a3a6a; cursor: pointer; font-size: 0.85rem; padding: 0 4px; transition: color 0.15s; }
    .tip-del:hover { color: #f87171; }
    .add-tip-row { display: flex; gap: 8px; }
    .add-tip-row select { width: 130px; flex-shrink: 0; padding: 8px 10px; font-size: 0.83rem; }
    .add-tip-row input  { flex: 1; padding: 8px 10px; font-size: 0.83rem; }
    .add-tip-btn {
      background: #2d1f4a; border: none; border-radius: 8px; padding: 8px 12px;
      color: #c084fc; cursor: pointer; font-size: 0.85rem; font-weight: 600;
      font-family: inherit; white-space: nowrap; transition: background 0.15s;
    }
    .add-tip-btn:hover { background: #3d2b60; }

    .modal-btns { display: flex; gap: 10px; margin-top: 22px; }
    .btn-save {
      flex: 1; background: #7c3aed; color: #fff; border: none; border-radius: 10px;
      padding: 13px; font-size: 0.95rem; font-weight: 700; cursor: pointer;
      font-family: inherit; transition: background 0.2s;
    }
    .btn-save:hover { background: #6d28d9; }
    .btn-cancel {
      background: #2d1f4a; color: #7c6a9e; border: none; border-radius: 10px;
      padding: 13px 20px; font-size: 0.95rem; cursor: pointer;
      font-family: inherit; transition: background 0.2s;
    }
    .btn-cancel:hover { background: #3d2b60; }

    /* FAB */
    .fab {
      position: fixed; bottom: 28px; right: 28px; width: 60px; height: 60px;
      background: #7c3aed; border: none; border-radius: 50%; font-size: 1.8rem;
      color: #fff; cursor: pointer; box-shadow: 0 6px 24px rgba(124,58,237,0.55);
      display: flex; align-items: center; justify-content: center;
      z-index: 100; transition: transform 0.2s, background 0.2s;
    }
    .fab:hover  { background: #6d28d9; transform: scale(1.08); }
    .fab:active { transform: scale(0.94); }

    @media (max-width: 480px) {
      body { padding: 18px 12px 90px; }
      .stats { gap: 6px; }
      .stat { padding: 10px 6px; }
      .form-row { flex-direction: column; gap: 0; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="big-emoji">🎤</div>
    <h1>Mine Sange</h1>
    <p>Øv dig, husk noder, broer, høje toner og sangtekster</p>
  </div>

  <div class="stats">
    <div class="stat want">
      <div class="num" id="cnt-want">0</div>
      <div class="lbl">🎵 Vil lære</div>
    </div>
    <div class="stat learning">
      <div class="num" id="cnt-learning">0</div>
      <div class="lbl">🎙️ Øver</div>
    </div>
    <div class="stat mastered">
      <div class="num" id="cnt-mastered">0</div>
      <div class="lbl">⭐ Mestret</div>
    </div>
  </div>

  <div class="toolbar">
    <button class="filter-btn active" data-f="all"      onclick="setFilter('all')">Alle</button>
    <button class="filter-btn"        data-f="want"     onclick="setFilter('want')">🎵 Vil lære</button>
    <button class="filter-btn"        data-f="learning" onclick="setFilter('learning')">🎙️ Øver</button>
    <button class="filter-btn"        data-f="mastered" onclick="setFilter('mastered')">⭐ Mestret</button>
    <input class="search-input" id="search" placeholder="🔍 Søg sang eller kunstner..." oninput="renderAll()" />
  </div>

  <div class="songs-list" id="songs-list"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modal-title">Tilføj sang</h2>

    <!-- Song search with autocomplete -->
    <div class="form-group">
      <label>
        Sangtitel *
        <span class="fetch-status" id="fetch-status"></span>
      </label>
      <div class="input-wrap">
        <input type="text" id="f-title" placeholder="Skriv sangtitel — tekst hentes automatisk..." autocomplete="off" />
        <div class="suggestions-box" id="suggestions"></div>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Kunstner</label>
        <input type="text" id="f-artist" placeholder="f.eks. Adele" />
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="f-status">
          <option value="want">🎵 Vil lære</option>
          <option value="learning">🎙️ Øver</option>
          <option value="mastered">⭐ Mestret</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>Toneart (valgfrit)</label>
      <input type="text" id="f-key" placeholder="f.eks. A♭ dur" />
    </div>

    <!-- Lyrics -->
    <div class="form-group">
      <label>Sangtekst</label>
      <textarea id="f-lyrics" placeholder="Hentes automatisk, eller indsæt manuelt..."></textarea>
    </div>

    <!-- Transliteration -->
    <div class="form-group">
      <div class="translit-label-row">
        <label style="margin-bottom:0;font-size:0.8rem;color:#7c6a9e;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;">Translitteration</label>
        <button class="auto-btn" id="auto-btn" onclick="runAutoTranslit()">
          <div class="spinner"></div>
          <span class="btn-lbl">✨ Auto</span>
        </button>
      </div>
      <textarea id="f-translit" placeholder="Hentes automatisk for ikke-latinske tekster..."></textarea>
    </div>

    <!-- Section tips -->
    <div class="tips-header">
      <label>Sektioner &amp; Tips</label>
    </div>
    <div class="tips-list" id="tips-list"></div>
    <div class="add-tip-row">
      <select id="tip-section">
        <option value="verse">Vers</option>
        <option value="chorus">Omkvæd</option>
        <option value="bridge">Bro</option>
        <option value="high">Høj node</option>
        <option value="breath">Åndedræt</option>
        <option value="key">Toneart/Noder</option>
        <option value="general">Generelt</option>
      </select>
      <input type="text" id="tip-text" placeholder="f.eks. stort crescendo, hold C# i 4 slag..." />
      <button class="add-tip-btn" onclick="addTip()">+ Tip</button>
    </div>

    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Annuller</button>
      <button class="btn-save"   onclick="saveItem()">Gem sang</button>
    </div>
  </div>
</div>

<button class="fab" onclick="openModal()">+</button>

<!-- Detail modal -->
<div class="detail-overlay" id="detail-overlay">
  <div class="detail-modal">
    <div class="dm-header">
      <div class="dm-info">
        <div class="dm-title"  id="dm-title"></div>
        <div class="dm-artist" id="dm-artist"></div>
        <div class="dm-badges" id="dm-badges"></div>
      </div>
      <button class="dm-close" onclick="window.closeDetailModal()">✕</button>
    </div>
    <div class="dm-body">
      <div class="dm-lyrics-pane">
        <div>
          <div class="dm-pane-label">Sangtekst</div>
          <div class="dm-tabs" id="dm-tabs"></div>
          <div id="dm-lyrics-text"></div>
        </div>
        <div id="dm-tips-wrap" style="display:none">
          <div class="dm-pane-label">Sektioner &amp; Tips</div>
          <div class="song-sections" id="dm-tips" style="padding:0"></div>
        </div>
      </div>
      <div class="dm-notes-pane">
        <div class="dm-pane-label">Dine noter</div>
        <textarea id="dm-notes" placeholder="Skriv dine noter her — svære linjer, vejrtrækningspauser, dynamik..."></textarea>
        <div class="dm-save-status" id="dm-save-status"></div>
      </div>
    </div>
  </div>
</div>

<script>
  let currentFilter = 'all';
  let editingKey    = null;
  let pendingTips   = [];

  const STATUS_LABEL = { want: '🎵 Vil lære', learning: '🎙️ Øver', mastered: '⭐ Mestret' };
  const STATUS_ICON  = { want: '🎵', learning: '🎙️', mastered: '⭐' };
  const SECTION_LABEL = {
    verse: 'Vers', chorus: 'Omkvæd', bridge: 'Bro',
    high: 'Høj node', breath: 'Åndedræt', key: 'Toneart', general: 'Generelt'
  };
  const SECTION_CLASS = {
    verse: 'sl-verse', chorus: 'sl-chorus', bridge: 'sl-bridge',
    high: 'sl-high', breath: 'sl-breath', key: 'sl-key', general: 'sl-general'
  };

  function esc(s) {
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  /* ── Debounce helper ── */
  function debounce(fn, ms) {
    let t;
    return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
  }

  /* ── Status label ── */
  function setStatus(msg) {
    document.getElementById('fetch-status').textContent = msg;
  }

  /* ── iTunes autocomplete ── */
  const debouncedSearch = debounce(async (query) => {
    if (query.length < 2) { hideSuggestions(); return; }
    try {
      const res  = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=musicTrack&limit=6&media=music`);
      const data = await res.json();
      showSuggestions(data.results || []);
    } catch(e) { hideSuggestions(); }
  }, 500);

  function showSuggestions(results) {
    const box = document.getElementById('suggestions');
    if (!results.length) {
      box.innerHTML = '<div class="sug-no-results">Ingen resultater</div>';
      box.classList.add('open');
      return;
    }
    box.innerHTML = results.map((r, i) => `
      <div class="sug-item" data-i="${i}">
        <img class="sug-thumb" src="${r.artworkUrl60 || ''}" alt="" onerror="this.style.visibility='hidden'" />
        <div class="sug-info">
          <div class="sug-title">${esc(r.trackName)}</div>
          <div class="sug-artist">${esc(r.artistName)}</div>
        </div>
      </div>`).join('');
    box.classList.add('open');
    box.querySelectorAll('.sug-item').forEach((el, i) => {
      el.addEventListener('mousedown', e => {
        e.preventDefault();
        selectSong(results[i].trackName, results[i].artistName);
      });
    });
  }

  function hideSuggestions() {
    const box = document.getElementById('suggestions');
    box.classList.remove('open');
    box.innerHTML = '';
  }

  /* ── Fetch lyrics ── */
  async function fetchLyrics(artist, title) {
    // Primary: lrclib.net
    try {
      const res = await fetch(`https://lrclib.net/api/get?artist_name=${encodeURIComponent(artist)}&track_name=${encodeURIComponent(title)}`);
      if (res.ok) {
        const d = await res.json();
        if (d.plainLyrics) return d.plainLyrics.trim();
      }
    } catch(e) {}
    // Fallback: lyrics.ovh
    try {
      const res = await fetch(`https://api.lyrics.ovh/v1/${encodeURIComponent(artist)}/${encodeURIComponent(title)}`);
      if (res.ok) {
        const d = await res.json();
        if (d.lyrics) return d.lyrics.replace(/\r\n/g,'\n').trim();
      }
    } catch(e) {}
    return null;
  }

  /* ── Needs transliteration? ── */
  function needsTranslit(text) {
    return /[؀-ۿݐ-ݿ一-鿿가-힯぀-ヿЀ-ӿऀ-ॿ฀-๿Ͱ-Ͽ]/.test(text);
  }

  /* ── Select song from dropdown ── */
  async function selectSong(trackName, artistName) {
    hideSuggestions();
    document.getElementById('f-title').value  = trackName;
    document.getElementById('f-artist').value = artistName;

    setStatus('📝 Henter sangtekst...');
    const lyrics = await fetchLyrics(artistName, trackName);

    if (lyrics) {
      document.getElementById('f-lyrics').value = lyrics;
      if (needsTranslit(lyrics)) {
        setStatus('✨ Translittererer...');
        await runAutoTranslit();
        setStatus('✅ Færdig!');
      } else {
        document.getElementById('f-translit').value = '';
        setStatus('✅ Tekst hentet!');
      }
    } else {
      setStatus('❌ Ingen tekst fundet');
    }
    setTimeout(() => setStatus(''), 3000);
  }

  /* ── Auto transliterate ── */
  window.runAutoTranslit = async () => {
    const lyrics = document.getElementById('f-lyrics').value.trim();
    if (!lyrics) { document.getElementById('f-lyrics').focus(); return; }
    const btn = document.getElementById('auto-btn');
    btn.classList.add('loading'); btn.disabled = true;
    try {
      const lines   = lyrics.split('\n');
      const results = [];
      const BATCH   = 6;
      for (let i = 0; i < lines.length; i += BATCH) {
        const batch = lines.slice(i, i + BATCH);
        const done  = await Promise.all(batch.map(async line => {
          if (!line.trim()) return '';
          const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&dt=rm&q=${encodeURIComponent(line)}`;
          const res  = await fetch(url);
          const data = await res.json();
          return (data[0] || []).map(s => s[3] || s[1] || '').join('').trim() || line;
        }));
        results.push(...done);
      }
      document.getElementById('f-translit').value = results.join('\n');
    } catch(e) {
      alert('Kunne ikke auto-translittere. Tjek din forbindelse.');
    } finally {
      btn.classList.remove('loading'); btn.disabled = false;
    }
  };

  /* ── Title input: trigger search ── */
  document.getElementById('f-title').addEventListener('input', e => {
    debouncedSearch(e.target.value.trim());
  });
  document.getElementById('f-title').addEventListener('blur', () => {
    setTimeout(hideSuggestions, 150);
  });

  /* ── Modal open/close ── */
  window.setFilter = (f) => {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.f === f));
    renderAll();
  };

  window.openModal = (key) => {
    editingKey = key || null;
    const song = key && window.songsCache[key];
    document.getElementById('modal-title').textContent = key ? 'Rediger sang' : 'Tilføj sang';
    document.getElementById('f-title').value    = song ? song.title   || '' : '';
    document.getElementById('f-artist').value   = song ? song.artist  || '' : '';
    document.getElementById('f-status').value   = song ? song.status  || 'want' : 'want';
    document.getElementById('f-key').value      = song ? song.key     || '' : '';
    document.getElementById('f-lyrics').value   = song ? song.lyrics  || '' : '';
    document.getElementById('f-translit').value = song ? song.translit|| '' : '';
    setStatus('');
    hideSuggestions();
    pendingTips = song && Array.isArray(song.tips) ? [...song.tips] : [];
    renderTipsList();
    document.getElementById('modal').classList.add('open');
    setTimeout(() => document.getElementById('f-title').focus(), 60);
  };

  window.closeModal = () => {
    document.getElementById('modal').classList.remove('open');
    hideSuggestions();
    editingKey = null; pendingTips = [];
    setStatus('');
  };

  /* ── Tips ── */
  window.addTip = () => {
    const text = document.getElementById('tip-text').value.trim();
    if (!text) { document.getElementById('tip-text').focus(); return; }
    pendingTips.push({ section: document.getElementById('tip-section').value, text });
    document.getElementById('tip-text').value = '';
    document.getElementById('tip-text').focus();
    renderTipsList();
  };

  function renderTipsList() {
    document.getElementById('tips-list').innerHTML = pendingTips.map((t, i) => `
      <div class="tip-row">
        <span class="tip-slbl ${SECTION_CLASS[t.section]||'sl-general'}" style="padding:2px 8px;border-radius:6px;font-size:0.75rem;">
          ${esc(SECTION_LABEL[t.section]||t.section)}
        </span>
        <span class="tip-txt">${esc(t.text)}</span>
        <button class="tip-del" onclick="removeTip(${i})">✕</button>
      </div>`).join('');
  }

  window.removeTip = (i) => { pendingTips.splice(i, 1); renderTipsList(); };

  document.getElementById('modal').addEventListener('click', e => {
    if (e.target === document.getElementById('modal')) window.closeModal();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { window.closeModal(); window.closeDetailModal(); } });

  /* ── Detail modal ── */
  let dmKey  = null;
  let dmSong = null;
  let dmMode = 'original';
  let dmSaveTimer;

  const dmAutoSave = debounce(async (val) => {
    if (!dmKey) return;
    try {
      await window._saveNotes(dmKey, val);
      const s = document.getElementById('dm-save-status');
      s.textContent = '✓ Gemt'; s.className = 'dm-save-status';
      clearTimeout(dmSaveTimer);
      dmSaveTimer = setTimeout(() => { s.textContent = ''; }, 2000);
    } catch {
      const s = document.getElementById('dm-save-status');
      s.textContent = 'Fejl ved gemning'; s.className = 'dm-save-status error';
    }
  }, 900);

  document.getElementById('dm-notes').addEventListener('input', e => {
    document.getElementById('dm-save-status').textContent = '';
    dmAutoSave(e.target.value);
  });

  document.getElementById('detail-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('detail-overlay')) window.closeDetailModal();
  });

  window.openDetailModal = (key) => {
    dmKey  = key;
    dmSong = window.songsCache[key];
    const song = dmSong;

    document.getElementById('dm-title').textContent  = song.title  || '';
    document.getElementById('dm-artist').textContent = song.artist || '';
    document.getElementById('dm-badges').innerHTML =
      `<span class="badge ${song.status}">${STATUS_LABEL[song.status]}</span>` +
      (song.key ? `<span class="badge key">🎼 ${esc(song.key)}</span>` : '');

    dmMode = song.lyrics ? 'original' : 'translit';
    const tabsEl = document.getElementById('dm-tabs');
    tabsEl.innerHTML = '';
    if (song.lyrics) {
      const b = document.createElement('button');
      b.className   = 'dm-tab' + (dmMode === 'original' ? ' active' : '');
      b.textContent = 'Original';
      b.onclick     = () => window.dmSwitch('original');
      tabsEl.appendChild(b);
    }
    if (song.translit) {
      const b = document.createElement('button');
      b.className   = 'dm-tab' + (dmMode === 'translit' ? ' active' : '');
      b.textContent = 'Translitteration';
      b.onclick     = () => window.dmSwitch('translit');
      tabsEl.appendChild(b);
    }
    dmRenderLyrics();

    const tips = Array.isArray(song.tips) ? song.tips : [];
    const wrap = document.getElementById('dm-tips-wrap');
    if (tips.length) {
      wrap.style.display = 'block';
      document.getElementById('dm-tips').innerHTML = tips.map(t => `
        <div class="section-tip">
          <span class="section-label ${SECTION_CLASS[t.section]||'sl-general'}">${esc(SECTION_LABEL[t.section]||t.section)}</span>
          <span class="section-text">${esc(t.text)}</span>
        </div>`).join('');
    } else {
      wrap.style.display = 'none';
    }

    document.getElementById('dm-notes').value = song.notes || '';
    document.getElementById('dm-save-status').textContent = '';
    document.getElementById('detail-overlay').classList.add('open');
  };

  window.closeDetailModal = () => {
    document.getElementById('detail-overlay').classList.remove('open');
    dmKey = null; dmSong = null;
  };

  window.dmSwitch = (mode) => {
    dmMode = mode;
    document.querySelectorAll('#dm-tabs .dm-tab').forEach(b => {
      b.classList.toggle('active',
        (mode === 'original' && b.textContent === 'Original') ||
        (mode === 'translit' && b.textContent === 'Translitteration')
      );
    });
    dmRenderLyrics();
  };

  function dmRenderLyrics() {
    const el   = document.getElementById('dm-lyrics-text');
    const song = dmSong;
    if (!song) return;
    if (dmMode === 'translit' && song.translit) {
      el.textContent = song.translit; el.className = 'translit';
    } else if (song.lyrics) {
      el.textContent = song.lyrics; el.className = '';
    } else {
      el.innerHTML = '<span class="dm-no-lyrics">Ingen sangtekst tilføjet endnu.</span>'; el.className = '';
    }
  }
  document.getElementById('tip-text').addEventListener('keydown', e => {
    if (e.key === 'Enter') window.addTip();
  });

  /* ── Render song cards ── */
  window.renderAll = () => {
    const q = (document.getElementById('search').value || '').toLowerCase();
    const entries = Object.entries(window.songsCache || {});
    const filtered = entries.filter(([, v]) => {
      const matchStatus = currentFilter === 'all' || v.status === currentFilter;
      const matchSearch = !q || (v.title||'').toLowerCase().includes(q) || (v.artist||'').toLowerCase().includes(q);
      return matchStatus && matchSearch;
    });

    document.getElementById('cnt-want').textContent     = entries.filter(([,v]) => v.status === 'want').length;
    document.getElementById('cnt-learning').textContent = entries.filter(([,v]) => v.status === 'learning').length;
    document.getElementById('cnt-mastered').textContent = entries.filter(([,v]) => v.status === 'mastered').length;

    const list = document.getElementById('songs-list');
    if (filtered.length === 0) {
      list.innerHTML = `<div class="empty-state"><div class="e-icon">🎵</div><p>${
        currentFilter === 'all' && !q
          ? 'Ingen sange endnu.<br>Tryk <strong style="color:#c084fc">+</strong> for at tilføje din første sang.'
          : 'Ingen sange matcher din søgning.'
      }</p></div>`;
      return;
    }

    list.innerHTML = '';
    filtered.forEach(([key, song]) => {
      const tips = Array.isArray(song.tips) ? song.tips : [];
      const hasLyrics = !!(song.lyrics || song.translit);
      const div = document.createElement('div');
      div.className = 'song-card';

      const tipsHtml = tips.length ? `
        <div class="song-sections">
          ${tips.map(t => `
            <div class="section-tip">
              <span class="section-label ${SECTION_CLASS[t.section]||'sl-general'}">${esc(SECTION_LABEL[t.section]||t.section)}</span>
              <span class="section-text">${esc(t.text)}</span>
            </div>`).join('')}
        </div>` : '';

      const lyricsHtml = hasLyrics ? `
        <div class="lyrics-toggle">
          <button class="toggle-btn">📖 Vis tekst ▾</button>
        </div>
        <div class="lyrics-panel">
          <div class="lyrics-grid${song.lyrics && song.translit ? '' : ' single'}">
            ${song.lyrics   ? `<div class="lyrics-col"><label>Original</label><pre>${esc(song.lyrics)}</pre></div>`  : ''}
            ${song.translit ? `<div class="lyrics-col translit"><label>Translitteration</label><pre>${esc(song.translit)}</pre></div>` : ''}
          </div>
        </div>` : '';

      div.innerHTML = `
        <div class="song-top">
          <div class="song-link">
            <div class="song-icon">${STATUS_ICON[song.status]||'🎵'}</div>
            <div class="song-main">
              <div class="song-title">${esc(song.title)}</div>
              <div class="song-artist">${esc(song.artist)}</div>
              <div class="song-badges">
                <span class="badge ${song.status}">${STATUS_LABEL[song.status]}</span>
                ${song.key ? `<span class="badge key">🎼 ${esc(song.key)}</span>` : ''}
              </div>
            </div>
          </div>
          <div class="song-actions">
            <button class="action-btn edit-btn" title="Rediger">✏️</button>
            <button class="action-btn del" title="Slet">🗑️</button>
          </div>
        </div>
        ${tipsHtml}
        ${lyricsHtml}
      `;

      div.querySelector('.song-link').addEventListener('click', () => window.openDetailModal(key));
      div.querySelector('.edit-btn').addEventListener('click', () => window.openModal(key));
      div.querySelector('.del').addEventListener('click', () => {
        if (confirm(`Slet "${song.title}"?`)) window._removeItem(key);
      });

      if (hasLyrics) {
        const btn   = div.querySelector('.toggle-btn');
        const panel = div.querySelector('.lyrics-panel');
        btn.addEventListener('click', () => {
          const open = panel.classList.toggle('open');
          btn.textContent = open ? '📖 Skjul tekst ▴' : '📖 Vis tekst ▾';
        });
      }

      list.appendChild(div);
    });
  };
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, push, update, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const app = initializeApp({
    apiKey: "AIzaSyBAdwm30ggf8K0gIgx9CkMvuayy6AiiCa4",
    authDomain: "breakfast-f7c80.firebaseapp.com",
    databaseURL: "https://breakfast-f7c80-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "breakfast-f7c80",
    storageBucket: "breakfast-f7c80.firebasestorage.app",
    messagingSenderId: "803322615237",
    appId: "1:803322615237:web:5c0345e647fa55a061e7ac"
  });

  const db = getDatabase(app);
  const songsRef = ref(db, 'practice_songs');
  window.songsCache = {};

  onValue(songsRef, snap => {
    window.songsCache = snap.val() || {};
    window.renderAll();
  });

  window.saveItem = () => {
    const title    = document.getElementById('f-title').value.trim();
    const artist   = document.getElementById('f-artist').value.trim();
    const status   = document.getElementById('f-status').value;
    const key      = document.getElementById('f-key').value.trim();
    const lyrics   = document.getElementById('f-lyrics').value.trim();
    const translit = document.getElementById('f-translit').value.trim();
    if (!title) { document.getElementById('f-title').focus(); return; }
    const data = { title, artist, status, key, lyrics, translit, tips: pendingTips };
    if (editingKey) {
      update(ref(db, `practice_songs/${editingKey}`), data);
    } else {
      push(songsRef, data);
    }
    window.closeModal();
  };

  window._removeItem = key => remove(ref(db, `practice_songs/${key}`));
  window._saveNotes  = (key, notes) => update(ref(db, `practice_songs/${key}`), { notes });
</script>

</body>
</html>
